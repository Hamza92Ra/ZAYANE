        <path d="M40 4 L60 20 L60 60 L40 76 L20 60 L20 20 Z"/>
        <path d="M40 4 L40 76 M20 20 L60 60 M60 20 L20 60"/>
      </g>
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="url(#skyFade)"/>
  <rect width="1600" height="1000" fill="url(#zellijBg)"/>
