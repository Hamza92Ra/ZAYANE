  <path d="M800 640 C790 655 790 675 800 690 C810 675 810 655 800 640 Z" fill="#C6963C" opacity="0.9"/>
  <line x1="778" y1="700" x2="770" y2="960" stroke="#B5623A" stroke-width="2" opacity="0.5"/>
  <line x1="822" y1="700" x2="830" y2="960" stroke="#B5623A" stroke-width="2" opacity="0.5"/>
