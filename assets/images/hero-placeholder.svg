<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="skyFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E9D3AE"/>
      <stop offset="55%" stop-color="#D3AE7C"/>
      <stop offset="100%" stop-color="#8C5A38"/>
    </linearGradient>
    <linearGradient id="archFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A2F22"/>
      <stop offset="100%" stop-color="#2B1B13"/>
